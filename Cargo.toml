[package]
name = "patrak"
version = "0.1.0"
edition = "2024"
description = "Daily learning tracker: courses watched in mpv, books read in zathura"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"], optional = true }
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"], optional = true }
md-5 = "0.11.0"
natord = "1.0.9"
notify-rust = "4.18.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
toml = "1.1.8"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = ["gui"]
gui = ["dep:gtk", "dep:adw"]
